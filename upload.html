<div class="container">
<div class="cardtwo">
  <h1>Upload your drink!</h1>
<br>
  <div class="field"> 
    <label for="name">your wonderful name</label>
    <input type="text" id="name" placeholder="Jane Doe" required>
  </div>

  <div class="field">
    <label for="email">review your drink</label>
    <input type="email" id="email" placeholder="this drink is so yummy..." required>
  </div>

  <div class="field">
<label for="name">rate your drink</label>
<span id="result">0/5</span>
    <div id="star-container">
    <div id="star">&#9733;</div>
     <div id="star">&#9733;</div>
      <div id="star">&#9733;</div>
       <div id="star">&#9733;</div>
        <div id="star">&#9733;</div>
</div>
</div>

  <div class="field">
    <label>Image</label>
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*">
      <p><span>Click to upload</span> or drag & drop</p>
      <p>PNG, JPG, WEBP up to 5MB</p>
    </div>

    <div id="preview">
      <img id="preview-img" src="" alt="Preview">
      <div class="preview-info">
        <span id="file-name"></span>
        <button id="remove-btn">✕ Remove</button>
      </div>
    </div>
  </div>

  <button id="submit-btn" disabled>
    <div class="spinner" id="spinner"></div>
    <span id="btn-text">Select an image to submit</span>
  </button>

    <div id="status"></div>
</div>
</div>




<script src="script.js" async defer></script>
